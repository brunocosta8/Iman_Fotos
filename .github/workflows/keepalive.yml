# Mantém o projeto Supabase grátis ativo (é pausado após 7 dias sem atividade)
# e limpa uploads abandonados. Corre de 3 em 3 dias.
#
# O GitHub desativa workflows agendados após 60 dias sem atividade no
# repositório; por isso, se o último commit tiver mais de 45 dias, este
# workflow faz um pequeno commit em .github/heartbeat.txt.
name: Keep-alive Supabase

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a função maintenance
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 -X POST "$SUPABASE_URL/functions/v1/maintenance" \
                 -H "x-maintenance-secret: $MAINTENANCE_SECRET" -H "content-type: application/json" -d '{}'; then
              echo; exit 0
            fi
            sleep $((i * 20))
          done
          exit 1

      - uses: actions/checkout@v4

      - name: Heartbeat (evita a desativação do workflow)
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            date -u +%FT%TZ > .github/heartbeat.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/heartbeat.txt
            git commit -m "chore: heartbeat"
            git push
          else
            echo "Último commit há menos de 45 dias — nada a fazer."
          fi
